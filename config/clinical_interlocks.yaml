# Hardcoded Clinical Interlocks (HCE) - single source of truth for Layer 4.
# Loaded by src/interlocks.py. The file's SHA-256 is stored in every audit record,
# so any change to a threshold is traceable. Edit via change control only.

schema_version: 1
policy:
  require_timestamps: true
  allow_unitless_values: true
  max_age_minutes:
    vitals: 30
    labs: 1440
  future_skew_minutes: 5

fields:
  eGFR:
    section: labs
    unit: "mL/min/1.73m2"
    min: 0
    max: 200
    conversions: {"mL/min": 1.0}
  Creatinine:
    section: labs
    unit: "mg/dL"
    min: 0.1
    max: 25
    conversions: {"umol/L": 0.011312}
  Platelets:
    section: labs
    unit: "/uL"
    min: 1000
    max: 2000000
    conversions: {"10^3/uL": 1000, "K/uL": 1000}
  INR:
    section: labs
    unit: "ratio"
    min: 0.5
    max: 15
  Lactate:
    section: labs
    unit: "mmol/L"
    min: 0.1
    max: 30
    conversions: {"mg/dL": 0.111}
  HeartRate:
    section: vitals
    unit: "bpm"
    min: 20
    max: 300
  SystolicBP:
    section: vitals
    unit: "mmHg"
    min: 30
    max: 300

rules:
  HCE-01:
    name: RENAL CONTRAST LOCKOUT
    blocks: [contrast_ct]
    criteria:
      - {field: eGFR, op: "<", value: 30}
      - {field: Creatinine, op: ">", value: 2.0}
  HCE-02:
    name: COAGULOPATHY THROMBOLYSIS LOCKOUT
    blocks: [tpa_recommendation]
    criteria:
      - {field: Platelets, op: "<", value: 100000}
      - {field: INR, op: ">", value: 1.7}
  HCE-03:
    name: HEMODYNAMIC INSTABILITY LOCKOUT
    blocks: ["*"]
    escalation: EMERGENCY_TRIAGE
    criteria:
      - {field: SystolicBP, op: "<", value: 90}
      - {field: ShockIndex, op: ">", value: 1.0}
      - {field: Lactate, op: ">=", value: 4.0}
